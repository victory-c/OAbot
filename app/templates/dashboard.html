<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OAbot</title>
<style>
  :root {
    color-scheme: light dark;
    --bg:#fafaf7; --card:#fff; --ink:#1a1a1a; --mute:#6b6b66; --line:#e6e4dc; --grid:#efede6;
    --accent:#d97757; --accent-fill:#c9603c; --accent-ink:#a84a28; --accent-soft:#d9775718;
    --busy:#e9e7df; --busy-ink:#4a4a45; --busy-edge:#b9b6aa;
    --due:#6b4fd8; --due-soft:#6b4fd81a; --ok:#2f8a50; --bad:#c43d3d; --today:#d977570d;
    --hour: 26px; --gut: 30px;
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#191918; --card:#232321; --ink:#eeeeea; --mute:#a3a39c; --line:#3a3a36; --grid:#2e2e2b;
    --accent:#e08a6b; --accent-fill:#c9603c; --accent-ink:#f0a388; --accent-soft:#e08a6b20;
    --busy:#34342f; --busy-ink:#d6d6cf; --busy-edge:#5c5c54;
    --due:#a996ff; --due-soft:#a996ff22; --ok:#5fc084; --bad:#f07a7a; --today:#e08a6b12;
  } }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { font: 15px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); margin: 0; overflow-wrap: anywhere; }
  main { max-width: 1240px; margin: 0 auto; padding: 20px 16px 80px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1.5rem; letter-spacing: -.01em; } h1 span { color: var(--accent); }
  h2 { margin: 0; font-size: 1rem; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .pill { font-size: .75rem; padding: 2px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--mute); white-space: nowrap; }
  .pill.on { border-color: var(--ok); color: var(--ok); }
  .tag { color: var(--mute); margin: 4px 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .layout { display: grid; gap: 0 18px; grid-template-columns: minmax(0, 1fr); }
  .layout > * { min-width: 0; }
  @media (min-width: 1000px) { .layout { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); align-items: start; } }
  /* Narrow screens: week, then what OAbot did, then the paste box. */
  @media (max-width: 999px) { .left { display: contents; } #items { order: 2; } .paste-card { order: 3; } }

  /* ---- This week strip ---- */
  .wk-head { display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; margin-bottom: 4px; }
  .legend { display: flex; gap: 4px 12px; flex-wrap: wrap; margin-left: auto; font-size: .75rem; color: var(--mute); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .legend .k-busy { background: var(--busy); border: 1px solid var(--busy-edge); }
  .legend .k-block { background: var(--accent-fill); }
  .legend .k-due { background: var(--due); border-radius: 0; transform: rotate(45deg) scale(.75); }
  .wk-sum { color: var(--mute); font-size: .85rem; margin: 0 0 10px; }
  .wk-sum b { color: var(--accent-ink); }
  .wk { display: grid; grid-template-columns: var(--gut) repeat(7, minmax(0, 1fr)); column-gap: 3px; }
  .wk-day { grid-row: 1; text-align: center; font-size: .75rem; color: var(--mute); padding: 2px 0 4px; line-height: 1.2; }
  .wk-day b { display: block; font-size: .95rem; color: var(--ink); font-weight: 600; }
  .wk-day.today b { color: #fff; background: var(--accent-fill); border-radius: 99px; width: 1.75em; margin: 1px auto 0; }
  .wk-dues { grid-row: 2; display: flex; flex-direction: column; gap: 2px; padding-bottom: 4px; min-width: 0; }
  .due { font-size: .68rem; line-height: 1.2; color: var(--due); background: var(--due-soft); border-left: 3px solid var(--due); border-radius: 3px; padding: 2px 4px; font-weight: 600; overflow: hidden; }
  .due span { display: block; font-weight: 400; opacity: .9; }
  .wk-hours, .wk-col { grid-row: 3; position: relative; height: calc(var(--hours) * var(--hour)); }
  .wk-hours span { position: absolute; right: 4px; transform: translateY(-50%); font-size: .65rem; color: var(--mute); white-space: nowrap; }
  .wk-col { border-radius: 6px; background:
      repeating-linear-gradient(to bottom, var(--grid) 0, var(--grid) 1px, transparent 1px, transparent var(--hour)); }
  .wk-col.today { background-color: var(--today); }
  .ev { position: absolute; overflow: hidden; border-radius: 4px; padding: 1px 4px; font-size: .68rem; line-height: 1.2;
        background: var(--busy); color: var(--busy-ink); border-left: 3px solid var(--busy-edge); }
  .ev b { font-weight: 600; display: block; }
  .ev span { display: block; opacity: .8; white-space: nowrap; }
  a.ev { text-decoration: none; }
  .ev.block { background: var(--accent-fill); color: #fff; border-left-color: #fff8; z-index: 2; font-size: .72rem;
              box-shadow: 0 1px 6px #c9603c66, 0 0 0 1.5px var(--card); }
  .ev.block.new { animation: pop 1.1s ease-out 3; }
  @keyframes pop { 0% { box-shadow: 0 0 0 0 #d97757cc; transform: scale(1.08); } 100% { box-shadow: 0 0 0 16px #d9775700; transform: scale(1); } }
  .dueline { position: absolute; left: 0; right: 0; height: 0; border-top: 2px dashed var(--due); z-index: 1; }
  .nowline { position: absolute; left: -2px; right: 0; height: 0; border-top: 2px solid var(--ink); z-index: 3; opacity: .75; }
  .nowline::before { content: ""; position: absolute; left: -3px; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
  .wk-note { color: var(--mute); font-size: .78rem; margin: 8px 0 0; }

  /* ---- Paste box ---- */
  details summary { cursor: pointer; font-weight: 600; }
  textarea, input { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); margin-top: 8px; }
  textarea { min-height: 110px; resize: vertical; }
  button { font: inherit; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; margin: 8px 6px 0 0; }
  button.go { background: var(--accent-fill); border-color: var(--accent-fill); color: #fff; font-weight: 600; }
  button:disabled { opacity: .6; cursor: default; }
  #sent { color: var(--mute); font-size: .85rem; }

  /* ---- Item cards ---- */
  .item.fresh { animation: rise .5s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(-6px); } }
  .item-head { display: flex; gap: 6px 10px; align-items: center; flex-wrap: wrap; }
  .company { font-weight: 700; font-size: 1.1rem; }
  .badge { font-size: .72rem; font-weight: 600; padding: 2px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
  .scheduled, .prepped { background: #3a9a5c22; color: var(--ok); } .processing { background: #d9a43a22; color: #b98a1f; }
  .needs_reply { background: #4a7fd922; color: #4a7fd9; } .ignored, .duplicate, .replaced, .dismissed { background: #8882; color: var(--mute); } .error { background: #d94a4a22; color: var(--bad); }
  .label { color: var(--mute); font-size: .8rem; }
  .row { margin-top: 8px; }
  .hero { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: var(--accent-soft); border-left: 4px solid var(--accent-fill); }
  .hero .cap { font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent-ink); }
  .hero .slot { font-size: 1.45rem; font-weight: 700; line-height: 1.2; letter-spacing: -.01em; margin-top: 2px; }
  .hero .slot span { font-weight: 500; white-space: nowrap; }
  .hero .meta { color: var(--mute); font-size: .85rem; margin-top: 4px; }
  .why { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 1rem; line-height: 1.45; }
  .why .cap { display: block; margin-bottom: 2px; }
  .plain-why { margin-top: 10px; }
  .prep { display: inline-block; margin-top: 12px; padding: 8px 14px; border-radius: 8px; background: var(--accent-fill); color: #fff; font-weight: 600; text-decoration: none; }
  .working { margin-top: 10px; color: var(--mute); }
  pre { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin: 4px 0 0; font: .85rem/1.5 ui-monospace, monospace; }
  .item.quiet { padding: 10px 16px; opacity: .8; } .item.quiet .company { font-size: .95rem; font-weight: 600; }
  .err { color: var(--bad); }
  a { color: var(--accent-ink); } .empty { color: var(--mute); text-align: center; padding: 32px 0; }
  .spin { display:inline-block; width:10px; height:10px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:s .7s linear infinite; vertical-align: -1px; }
  @keyframes s { to { transform: rotate(360deg); } }

  @media (max-width: 640px) {
    :root { --hour: 22px; --gut: 20px; }
    main { padding: 14px 12px 60px; }
    .card { padding: 12px; }
    .wk { column-gap: 2px; }
    .wk-hours span { font-size: .56rem; right: 2px; }
    .ev { font-size: .58rem; padding: 1px 2px; border-left-width: 2px; line-height: 1.12; }
    .ev.block { font-size: .6rem; }
    .ev span { display: none; }
    .due { font-size: .56rem; padding: 2px; border-left-width: 2px; }
    .wk-day { font-size: .68rem; }
    .legend { margin-left: 0; }
    .hero .slot { font-size: 1.25rem; }
  }
  @media (prefers-reduced-motion: reduce) { .ev.block.new, .item.fresh { animation: none; } }
</style></head>
<body><main>
  <header><h1>OA<span>bot</span></h1><div class="pills" id="pills"></div></header>
  <p class="tag">Recruiting emails come in. Time gets blocked and prep gets written. You just show up.</p>

  <div class="layout">
    <div class="left">
      <section class="card" aria-label="This week">
        <div class="wk-head"><h2>This week</h2>
          <div class="legend"><span><i class="k-busy"></i>Classes and events</span><span><i class="k-block"></i>Blocked by OAbot</span><span><i class="k-due"></i>Coursework due</span></div>
        </div>
        <div id="week"><p class="wk-sum">Loading your week&hellip;</p></div>
      </section>

      <div class="card paste-card">
        <details id="paste"><summary>Paste an email (demo and fallback)</summary>
          <input id="subject" placeholder="Subject" aria-label="Subject">
          <textarea id="body" placeholder="Paste the email body" aria-label="Email body"></textarea>
          <button class="go" id="go" onclick="send()">Process</button><span id="samples"></span>
          <div id="sent" role="status"></div>
        </details>
      </div>
    </div>

    <div id="items"><div class="empty">Waiting for recruiting emails&hellip;</div></div>
  </div>
</main>
<script>
// Everything rendered here comes from emails or the web: every interpolated value goes through esc().
const $ = id => document.getElementById(id);
const esc = s => (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
let TZ;  // the student's timezone (from the server), so times read the same on any device
const fmt = (iso, opts) => {
  const d = new Date(iso);
  if (!iso || isNaN(d)) return (iso ?? '').toString();
  try { return d.toLocaleString([], {...opts, timeZone: TZ}); } catch { return d.toLocaleString([], opts); }
};
const day = iso => fmt(iso, {weekday:'short', month:'short', day:'numeric'});
const clock = iso => fmt(iso, {hour:'numeric', minute:'2-digit'});
const when = iso => fmt(iso, {weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
const shortClock = m => { const h = Math.floor(m / 60) % 24, mm = m % 60; return (h % 12 || 12) + (mm ? ':' + String(mm).padStart(2, '0') : '') + (h < 12 ? 'a' : 'p'); };

/* ---------- This week strip ---------- */
const H0 = 9, H1 = 22;          // same hours the scheduler is allowed to use
const seenBlocks = new Map();   // block id -> first time we saw it (to pulse new ones)
let weekLoaded = false, lastWeek = '', weekData = null;

function lanes(evts) {          // side-by-side columns for overlapping events
  evts.sort((a, b) => a.start_min - b.start_min || b.end_min - a.end_min);
  let group = [], ends = [], groupEnd = -1;
  const flush = () => { group.forEach(e => e.lanes = ends.length); group = []; ends = []; groupEnd = -1; };
  for (const e of evts) {
    if (group.length && e.start_min >= groupEnd) flush();
    let l = ends.findIndex(end => end <= e.start_min);
    if (l < 0) { l = ends.length; ends.push(0); }
    ends[l] = e.end_min; e.lane = l; group.push(e); groupEnd = Math.max(groupEnd, e.end_min);
  }
  flush();
}

function blockName(b) {
  const what = b.kind === 'oa' ? 'OA' : (b.kind || '').startsWith('interview') ? 'Prep' : '';
  if (what && b.company) return what + ': ' + b.company;
  return (b.title || 'OAbot block').replace(/\s*\(due .*\)\s*$/, '');
}

function renderWeek(c) {
  const now = Date.now(), from = H0 * 60, to = H1 * 60, span = to - from;
  const pct = m => (Math.min(Math.max(m, from), to) - from) / span * 100;
  const cols = c.days.map(() => []);
  for (const e of c.busy) if (cols[e.day] && e.end_min > from && e.start_min < to) cols[e.day].push({...e, block: e.oabot});
  for (const b of c.blocks) {
    if (!cols[b.day]) continue;
    const key = String(b.id);
    if (!seenBlocks.has(key)) seenBlocks.set(key, weekLoaded ? now : 0);
    cols[b.day].push({...b, block: true, isNew: now - seenBlocks.get(key) < 8000});
  }
  let h = `<div class="wk" style="--hours:${H1 - H0}"><div class="wk-hours" style="grid-column:1">`;
  for (let hr = H0; hr <= H1; hr += 1) if ((hr - H0) % 2 === 0) h += `<span style="top:${(hr - H0) / (H1 - H0) * 100}%">${shortClock(hr * 60)}</span>`;
  h += '</div>';
  c.days.forEach((d, i) => {
    const today = i === 0 ? ' today' : '', col = `grid-column:${i + 2}`;
    h += `<div class="wk-day${today}" style="${col}">${esc(d.weekday)}<b>${esc(d.day)}</b></div>`;
    const dues = c.deadlines.filter(x => x.day === i);
    h += `<div class="wk-dues" style="${col}">` + dues.map(x =>
      `<div class="due" title="${esc(x.title)}, due ${esc(when(x.due))}">${esc(x.title)}<span>due ${esc(shortClock(x.min))}</span></div>`).join('') + '</div>';
    h += `<div class="wk-col${today}" style="${col}" data-day="${i}">`;
    for (const x of dues) h += `<div class="dueline" style="top:${pct(x.min)}%" title="${esc(x.title)}, due ${esc(when(x.due))}"></div>`;
    lanes(cols[i]);
    for (const e of cols[i]) {
      const top = pct(e.start_min), height = Math.max(pct(e.end_min) - top, 3.2);
      const box = `top:${top}%;height:calc(${height}% - 1px);left:${e.lane / e.lanes * 100}%;width:calc(${100 / e.lanes}% - 1px)`;
      const range = `${shortClock(e.start_min)} to ${shortClock(e.end_min)}`;
      if (e.block) {
        const name = blockName(e), id = Number(e.id);
        const tip = `${esc(e.title || name)}, ${esc(range)}`;
        h += id ? `<a class="ev block${e.isNew ? ' new' : ''}" href="#item-${id}" style="${box}" title="${tip}"><b>${esc(name)}</b><span>${esc(range)}</span></a>`
                : `<div class="ev block" style="${box}" title="${tip}"><b>${esc(name)}</b><span>${esc(range)}</span></div>`;
      } else {
        h += `<div class="ev" style="${box}" title="${esc(e.title)}, ${esc(range)}"><b>${esc(e.title)}</b><span>${esc(range)}</span></div>`;
      }
    }
    h += '</div>';
  });
  h += '</div>';

  const nb = c.blocks.length + c.busy.filter(e => e.oabot).length, ne = c.busy.filter(e => !e.oabot).length, nd = c.deadlines.length;
  const around = `${ne} ${ne === 1 ? 'event' : 'events'} and ${nd} coursework ${nd === 1 ? 'deadline' : 'deadlines'}`;
  const sum = nb ? `<b>${nb} ${nb === 1 ? 'block' : 'blocks'} placed by OAbot</b> around ${around}.`
                 : `${around} this week. Blocks OAbot creates show up here in orange.`;
  const notes = Object.entries(c.problems || {}).map(([k, v]) => `${esc(k)} ${esc(v)}`);
  $('week').innerHTML = `<p class="wk-sum">${sum}</p>${h}` +
    (notes.length ? `<p class="wk-note">Could not refresh: ${notes.join('; ')}. Showing what is available.</p>` : '');
  weekLoaded = true;
  placeNow();
}

function placeNow() {             // "now" line in today's column, in the student's timezone
  document.querySelectorAll('.nowline').forEach(n => n.remove());
  const col = document.querySelector('.wk-col[data-day="0"]'); if (!col || !weekData) return;
  let parts;
  try { parts = new Intl.DateTimeFormat('en-CA', {timeZone: TZ, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23'}).formatToParts(new Date()); }
  catch { return; }
  const p = Object.fromEntries(parts.map(x => [x.type, x.value]));
  if (`${p.year}-${p.month}-${p.day}` !== weekData.days[0].date) return;
  const m = Number(p.hour) * 60 + Number(p.minute);
  if (m < H0 * 60 || m > H1 * 60) return;
  const line = document.createElement('div'); line.className = 'nowline'; line.title = 'Now';
  line.style.top = (m - H0 * 60) / ((H1 - H0) * 60) * 100 + '%';
  col.appendChild(line);
}

/* ---------- Item cards ---------- */
const KINDS = {oa:'Online assessment', interview_scheduled:'Interview', interview_needs_availability:'Interview: needs your times', rejection:'Rejection', other:'Not recruiting'};
const STATUSES = ['processing', 'scheduled', 'prepped', 'needs_reply', 'ignored', 'error', 'duplicate', 'replaced', 'dismissed'];
// Rows that no longer own a calendar block: a reminder for an existing one, a block that was moved, or one the student dismissed.
const SETTLED = {duplicate: 'reminder', replaced: 'moved', dismissed: 'dismissed'};

function card(i) {
  const status = STATUSES.includes(i.status) ? i.status : 'processing';
  const kind = i.kind || '', interview = kind.startsWith('interview');
  const settled = status in SETTLED;
  const quiet = status === 'ignored' || settled;
  let h = `<div class="item-head"><span class="company">${esc(i.company || i.subject || 'New email')}</span>
    <span class="badge ${status}">${status === 'processing' ? '<span class="spin"></span> working' : esc(SETTLED[status] || status.replace('_', ' '))}</span>
    <span class="label">${esc(KINDS[kind] || '')}${i.role ? ' &middot; ' + esc(i.role) : ''}</span></div>`;
  if (i.event_start && !settled) {
    const link = safeUrl(i.event_link);
    const meta = [i.deadline ? `Due ${esc(when(i.deadline))}` : '',
                  link ? `<a href="${esc(link)}" target="_blank" rel="noopener noreferrer">open in Calendar</a>` : ''].filter(Boolean);
    h += `<div class="hero"><div class="cap">${interview ? 'Prep time blocked for you' : 'Blocked for you'}</div>
      <div class="slot">${esc(day(i.event_start))} <span>${esc(clock(i.event_start))} to ${esc(clock(i.event_end))}</span></div>
      ${meta.length ? `<div class="meta">${meta.join(' &middot; ')}</div>` : ''}
      ${i.reasoning ? `<div class="why"><span class="cap">Why this slot</span>${esc(i.reasoning)}</div>` : ''}</div>`;
  } else {
    if (i.deadline && !settled) h += `<div class="row"><span class="label">Due</span> ${esc(when(i.deadline))}</div>`;
    if (i.reasoning) h += `<div class="plain-why"><span class="label">Why</span> ${esc(i.reasoning)}</div>`;
  }
  if (i.has_prep) h += `<a class="prep" href="/prep/${Number(i.id)}">Open prep doc &rarr;</a>`;
  if (status === 'processing' || (status === 'needs_reply' && !i.has_prep)) {
    const doing = !kind ? 'Reading the email' : kind === 'oa' ? 'Checking classes and coursework for the best slot'
      : interview && !i.has_prep ? 'Researching the company and interviewer' : interview ? 'Finding time to prep before the interview' : 'Working';
    h += `<div class="working"><span class="spin"></span> ${doing}&hellip;</div>`;
  }
  if (i.draft_reply) h += `<div class="row"><span class="label">Reply draft (not sent, you send it)</span><pre>${esc(i.draft_reply)}</pre></div>`;
  if (i.error) h += `<div class="row err">${esc(i.error)}</div>`;
  return {cls: 'card item' + (quiet ? ' quiet' : ''), html: h};
}

const cards = new Map();   // item id -> element; only cards whose content changed are touched
let itemsLoaded = false, lastItems = '';
function renderItems(items) {
  const box = $('items');
  if (!items.length) { cards.clear(); box.innerHTML = '<div class="empty">Waiting for recruiting emails&hellip;</div>'; itemsLoaded = true; return; }
  if (!cards.size) box.innerHTML = '';
  const live = new Set();
  let prev = null;
  for (const it of items) {
    const id = String(it.id); live.add(id);
    const c = card(it);
    let el = cards.get(id);
    const fresh = !el && itemsLoaded;
    if (!el) { el = document.createElement('article'); el.id = 'item-' + Number(it.id); cards.set(id, el); }
    if (el._html !== c.html || el._cls !== c.cls) { el.className = c.cls + (fresh ? ' fresh' : ''); el.innerHTML = c.html; el._html = c.html; el._cls = c.cls; }
    const want = prev ? prev.nextSibling : box.firstChild;
    if (want !== el) box.insertBefore(el, want);
    prev = el;
  }
  for (const [id, el] of cards) if (!live.has(id)) { el.remove(); cards.delete(id); }
  itemsLoaded = true;
}

/* ---------- Polling: only re-render when the data actually changed ---------- */
async function refreshItems() {
  try {
    const text = await (await fetch('/api/items')).text();
    if (text === lastItems) return;
    renderItems(JSON.parse(text)); lastItems = text;
  } catch (e) { /* server restarting: keep what is on screen */ }
}
async function refreshWeek() {
  try {
    const text = await (await fetch('/api/calendar')).text();
    if (text === lastWeek) return;
    weekData = JSON.parse(text); TZ = TZ || weekData.tz; renderWeek(weekData); lastWeek = text;
  } catch (e) { /* keep what is on screen */ }
}
function loop(fn, ms) { const run = async () => { await fn(); setTimeout(run, ms); }; run(); }

async function send() {
  const body = $('body').value.trim(); if (!body) return;
  $('go').disabled = true;
  try {
    const r = await fetch('/api/ingest', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({subject: $('subject').value, body})});
    if (!r.ok) throw new Error();
    $('subject').value = ''; $('body').value = '';
    $('sent').textContent = 'Got it. Watch the week above.';
  } catch (e) { $('sent').textContent = 'Could not send that. Is the server running?'; }
  $('go').disabled = false;
  refreshItems();
}

async function init() {
  let s = {};
  try { s = await (await fetch('/api/status')).json(); } catch (e) {}
  TZ = s.tz || undefined;
  $('pills').innerHTML = `<span class="pill ${s.gmail ? 'on' : ''}">Gmail ${s.gmail ? 'watching' : 'off'}</span>
    <span class="pill ${s.calendar === 'google' ? 'on' : ''}">Calendar: ${esc(s.calendar)}</span>
    <span class="pill ${s.bcourses ? 'on' : ''}">bCourses ${s.bcourses ? 'connected' : 'mock'}</span>`;
  if (!s.gmail) $('paste').open = true;
  loop(refreshItems, 2500); loop(refreshWeek, 2500);
  setInterval(placeNow, 60000);
  try {
    const samples = await (await fetch('/api/samples')).json();
    for (const [name, e] of Object.entries(samples)) {
      const b = document.createElement('button'); b.textContent = 'Sample: ' + name;
      b.onclick = () => { $('subject').value = e.subject; $('body').value = e.body; $('sent').textContent = ''; };
      $('samples').appendChild(b);
    }
  } catch (e) {}
}
init();
</script></body></html>
