<!doctype html>
<html lang="en"><head>
{{head}}
<title>{{title}} &middot; Hire Me Maybe</title>
<style>
  /* prep-only layout; everything shared lives in /static/ui.css */
  .back { display:inline-flex; align-items:center; gap:8px; min-height:44px; margin:20px 0 8px; font-size:15px; }
  .prose { padding-bottom:16px; }
  .prose .scroll { overflow-x:auto; margin:0 0 14px; }
  .prose .sources { margin-top:40px; padding:4px 16px 12px; background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); font-size:14px; line-height:1.45; color:var(--muted); }
  .prose .sources h2 { font-size:12px; font-weight:500; color:var(--muted); border:0; margin:10px 0 4px; padding:0; }
  .prose .sources li { margin:4px 0; }
</style></head>
<body>
{{header}}
<main class="wrap--reading" id="main">
  <a class="link back" href="/"><svg class="m-arrow m-arrow--back" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M13 8H3M7 4 3 8l4 4"/></svg>Back to inbox</a>
  <article class="prose">{{content}}</article>
</main>
</body></html>
