# Publishes the project page in docs/ to GitHub Pages.
# The page reuses the app's own stylesheet and logo, copied from app/static/ here so there is one source.
name: Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", "app/static/ui.css", "app/static/favicon.svg", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R docs/. _site/
          cp app/static/ui.css app/static/favicon.svg _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
